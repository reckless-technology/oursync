name: release

# One release of OurSync, left a private draft.
#
# Push a tag vMAJOR.MINOR (v1.0) and the .deb is built from nothing, installed, exercised and
# attached to a draft GitHub release vMAJOR.MINOR.0 with its checksum. Run it by hand
# (workflow_dispatch) and the same happens at the head of main, as vMAJOR.MINOR.BUILD where BUILD
# is the number of commits since the nearest vMAJOR.MINOR tag - the version the package and the
# script both report, from tools/version.sh. A dry run builds and tests exactly as a release does,
# on any branch, and makes no draft: its files are kept as the run's artifacts.
#
# The release stays a draft. Nothing here publishes it, pushes a tag or announces anything:
# publishing is a human step, taken after looking at what the draft holds. This mirrors how the
# rest of the organisation's products are released.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; make no draft"
        type: boolean
        default: false

permissions:
  contents: write       # create the draft release and upload its files

# A tag push and a dispatch at once would each open and replace drafts under the other, so one at
# a time, and a run waits rather than cancelling one that could be half-way through an upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and draft
    runs-on: ubuntu-24.04
    # 20 was not enough. On 2026-11-18 two runs in a row drew a runner whose Ubuntu mirror was
    # crawling - rclone's 16.5 MB alone took four minutes - and the apt step ate fourteen of the
    # twenty, leaving the release to be killed in the middle of its own test. A timeout kill is
    # reported as a cancelled step with no error in the log, which reads like somebody pressed the
    # button rather than like a slow mirror.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # version.sh reads the tags

      - name: Which version, and is this allowed to make a draft?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+$'; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR. Version marks have two components."
              exit 1
            fi
          fi
          dry_run=false
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.dry_run }}" = true ]; then
            dry_run=true
          fi
          # Releases are cut from main and nowhere else. A dry run, which makes no draft, may run
          # anywhere.
          if [ "$dry_run" = false ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::$GITHUB_SHA is not on main, so it cannot be released."
              exit 1
            fi
          fi
          version=$(tools/version.sh)
          if [ "$version" = 0.0.0 ] && [ "$dry_run" = false ]; then
            echo "::error::no vMAJOR.MINOR tag is reachable, so there is no version to release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "OurSync $version (dry run: $dry_run)"

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          # Retries rather than one shot: the mirror a hosted runner draws is sometimes slow enough
          # to drop a connection part-way, and a failed fetch here fails the whole release.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            dpkg-dev debhelper lintian fakeroot build-essential fuse3 rclone

      - name: Build the package
        env:
          HEADLINE: "OurSync ${{ steps.version.outputs.version }}"
        run: tools/build-deb.sh

      - name: lintian
        run: lintian --fail-on error --tag-display-limit 0 build/deb/*.changes

      - name: Install it and exercise it
        env:
          # NOT named RCLONE_VERSION. rclone reads any flag from RCLONE_<FLAG>, which is the whole
          # reason the control-port password can be passed safely through the environment - and it
          # means RCLONE_VERSION is read as --version, a boolean, so every later rclone call dies
          # with `strconv.ParseBool: parsing "1.76.0"`. Keep workflow variables out of that
          # namespace entirely rather than hoping a name is not a flag.
          TARGET_RCLONE: "1.76.0"
        run: |
          set -euo pipefail
          # --no-install-recommends, and it is about time rather than tidiness. The package
          # Recommends nemo and libnotify-bin, so a plain install pulls nemo, gvfs, webkit2gtk,
          # yelp, file-roller and gstreamer: on 2026-11-18 that took 32 minutes on a hosted
          # runner's mirror and killed three release runs at the timeout, which was then blamed on
          # the mirror and "fixed" by raising the cap twice. None of that tree is exercised here -
          # the Nemo actions are files, and dpkg -L in build.yml is what checks they land.
          sudo apt-get install -y --no-install-recommends "./$(echo build/deb/oursync_*_all.deb)"
          oursync version
          test "$(oursync version)" = "oursync ${{ steps.version.outputs.version }}"
          man --where oursync

          # This image's apt rclone is 1.60.1, which is below OurSync's measured floor, so the
          # package's own unversioned dependency pulls a version OurSync refuses to run on - by
          # design, since dpkg cannot see an rclone installed from rclone.org and PATH is what
          # decides. The question a release has to answer is whether a *supported* rclone can drive
          # it, so install the one the README tells users to install and exercise against that.
          # build.yml covers the other direction, asserting the unsupported versions are refused.
          (
            cd "$(mktemp -d)"
            curl -fsSL -o SHA256SUMS "https://downloads.rclone.org/v$TARGET_RCLONE/SHA256SUMS"
            curl -fsSL -o rclone.zip \
              "https://downloads.rclone.org/v$TARGET_RCLONE/rclone-v$TARGET_RCLONE-linux-amd64.zip"
            want=$(grep "rclone-v$TARGET_RCLONE-linux-amd64.zip" SHA256SUMS | awk '{print $1}')
            got=$(sha256sum rclone.zip | awk '{print $1}')
            [ "$want" = "$got" ] || { echo "::error::rclone $TARGET_RCLONE checksum mismatch"; exit 1; }
            unzip -q rclone.zip
            sudo install -m 755 "rclone-v$TARGET_RCLONE-linux-amd64/rclone" /usr/local/bin/rclone
          )
          rclone version | head -1

          oursync doctor
          # The same functional test CI runs on every push, so nothing is released that a supported
          # rclone cannot actually drive.
          tools/rclone-floor-test.sh

      - name: Checksums
        run: |
          set -euo pipefail
          cd build/deb
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: oursync-${{ steps.version.outputs.version }}
          path: build/deb/*
          retention-days: 14

      - name: Leave a draft release
        if: steps.version.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A published release of this version stops the run rather than being touched; an earlier
          # draft of it is replaced, so a re-run is safe.
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published. Bump the tag rather than overwriting a release."
            exit 1
          fi
          [ "$state" = true ] && gh release delete "$TAG" --yes
          # The notes go through a file rather than --notes. A quoted argument spanning lines has
          # to keep every line indented past the `run: |` block, or the block scalar ends and the
          # workflow stops being valid YAML - which it did, and GitHub reports that as a failed run
          # with no jobs and no log.
          {
            echo "Install on Linux Mint 22 / Ubuntu 24.04 or newer:"
            echo
            echo '```sh'
            echo "sudo apt install ./oursync_${VERSION}_all.deb"
            echo "oursync setup"
            echo "systemctl --user enable --now oursync-mount.service"
            echo "systemctl --user enable --now oursync-refresh.timer"
            echo '```'
            echo
            echo "Needs rclone 1.60 or newer, which is what apt ships; every feature OurSync uses"
            echo "is tested against that version in CI."
            echo
            echo "\`oursync setup\` walks the one-time Google Cloud step. OurSync ships no OAuth"
            echo "client ID, because an application distributing its own with Google's restricted"
            echo "drive scope needs OAuth verification and an annually renewed third-party"
            echo "security assessment."
          } > build/deb/notes.md
          gh release create "$TAG" \
            --draft \
            --title "OurSync $VERSION" \
            --notes-file build/deb/notes.md \
            build/deb/*.deb build/deb/SHA256SUMS
          gh release view "$TAG"
